services:
  - type: static_site
    name: spainrp-oficial
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      # URL del backend (API) - donde el frontend hace las peticiones
      - key: VITE_API_URL
        value: https://spainrp-web-pqog.onrender.com
      - key: VITE_BOT_URL
        value: https://spainrp-web-pqog.onrender.com
      - key: VITE_SHOP_URL
        value: https://spainrp-oficial-1uly.onrender.com
      - key: VITE_PPT_URL
        value: https://spainrp-oficial-1uly.onrender.com
